name: R syntax check

on:
  pull_request:
    paths:
      - "**/*.R"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/r-syntax.yml"
  push:
    branches:
      - "cleanup-harmonized-qc-v2"

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.1"
      - name: Parse R scripts
        shell: Rscript {0}
        run: |
          files <- list.files(".", pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
          stopifnot(length(files) > 0)
          for (f in files) {
            message("Parsing ", f)
            parse(file = f)
          }
          message("All R scripts parsed successfully.")
