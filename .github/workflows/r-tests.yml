name: R pipeline tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("yaml","digest","dplyr","readr","tidyr","purrr","tibble","ggplot2","scales","viridisLite","testthat"), repos="https://cloud.r-project.org")'
      - name: Run tests
        run: Rscript tests/run_tests.R
